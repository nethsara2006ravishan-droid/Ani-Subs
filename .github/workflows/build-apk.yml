name: Ani Subs APK Builder
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g cordova
      - run: |
          cordova create app com.nethsara.anisubs "Ani Subs"
          cp index.html manifest.json sw.js icon-192.png icon-512.png app/www/
          cp icon-512.png app/www/icon.png
          python3 -c "import re; p='app/config.xml'; t=open(p).read(); t=re.sub(r'<icon[^>]*/?>', '', t); t=t.replace('</widget>', '  <icon src=\"www/icon.png\" />\n</widget>'); open(p,'w').write(t)"
          cd app
          cordova platform add android
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Ani-Subs-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
