name: Ani Subs APK Builder
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g cordova
      - run: |
          cordova create app com.nethsara.anisubs "Ani Subs"
          cp index.html manifest.json sw.js icon-192.png icon-512.png app/www/
          cd app
          cordova platform add android
          for d in platforms/android/app/src/main/res/mipmap-*/; do cp ../icon-512.png "$d/ic_launcher.png"; cp ../icon-512.png "$d/ic_launcher_round.png"; done
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Ani-Subs-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
